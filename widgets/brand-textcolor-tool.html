<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand Color Accessibility Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @font-face { font-family:'Halyard Display'; font-weight:500; font-display:swap; src:url('../assets/fonts/HalyardDisplay-Medium.woff2') format('woff2'); }
    @font-face { font-family:'Halyard Display'; font-weight:600; font-display:swap; src:url('../assets/fonts/HalyardDisplay-SemiBold.woff2') format('woff2'); }
    @font-face { font-family:'Halyard Text';    font-weight:400; font-display:swap; src:url('../assets/fonts/HalyardText-Book.woff2') format('woff2'); }
    @font-face { font-family:'Halyard Text';    font-weight:500; font-display:swap; src:url('../assets/fonts/HalyardText-Medium.woff2') format('woff2'); }
    @font-face { font-family:'Halyard Text';    font-weight:600; font-display:swap; src:url('../assets/fonts/HalyardText-SemiBold.woff2') format('woff2'); }
    body { font-family:'Halyard Text', -apple-system, BlinkMacSystemFont, sans-serif; }
    /* Headline: Halyard Display Medium, three tight lines */
    .cit-headline { font-family:'Halyard Display', -apple-system, sans-serif; font-weight:500; line-height:1.0; letter-spacing:-0.02em; font-size:clamp(2.75rem, 7.8vw, 7.5rem); }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useCallback } = React;

    /* ========================================================================
     * palette config — the ONLY place colors live.
     * Replace with official brand values. Order = left->right hue order.
     * ======================================================================*/
    const palette = {
      purple: { hue: "#8000FF", shades: ["#F3E9FF","#D9B3FF","#B266FF","#8000FF","#6600CC","#330066"] },
      pink:   { hue: "#FE3394", shades: ["#FFF2F8","#FFA4CF","#FF66AF","#FE3394","#CC0062","#660031"] },
      green:  { hue: "#15D676", shades: ["#DEFFEE","#AAFFD4","#49EE9C","#15D676","#10A35A","#095730"] },
      blue:   { hue: "#00D5FF", shades: ["#D6F8FF","#A4F0FF","#66E6FF","#00D5FF","#0095B2","#00404D"] },
      yellow: { hue: "#FFE900", shades: ["#FFFDE5","#FFF9B5","#FFF266","#FFE900","#B2A300","#4D4600"] },
      orange: { hue: "#FF7B00", shades: ["#FFEAD7","#FFD5AE","#FFAD60","#FF7B00","#B25600","#4D2500"] },
    };

    /* textPalette — SAME keys + order. Each entry { color, opacity }:
       a base brand ink (black/white) applied at an opacity over the bg.
       black @ 0.7 over a vivid primary == the brand "deep" ink. */
    const T = (color, opacity = 1) => ({ color, opacity });
    const textPalette = {
      purple: { shades: [T("#000000"),T("#000000"),T("#000000"),T("#FFFFFF"),     T("#FFFFFF"),T("#FFFFFF")] },
      pink:   { shades: [T("#000000"),T("#000000"),T("#000000"),T("#FFFFFF"),     T("#FFFFFF"),T("#FFFFFF")] },
      green:  { shades: [T("#000000"),T("#000000"),T("#000000"),T("#000000",0.7), T("#FFFFFF"),T("#FFFFFF")] },
      blue:   { shades: [T("#000000"),T("#000000"),T("#000000"),T("#000000",0.7), T("#FFFFFF"),T("#FFFFFF")] },
      yellow: { shades: [T("#000000"),T("#000000"),T("#000000"),T("#000000",0.7), T("#FFFFFF"),T("#FFFFFF")] },
      orange: { shades: [T("#000000"),T("#000000"),T("#000000"),T("#000000",0.7), T("#FFFFFF"),T("#FFFFFF")] },
    };

    const resolveColors = (hueKey, shadeIndex) => ({
      background: palette[hueKey].shades[shadeIndex],
      text: textPalette[hueKey].shades[shadeIndex],
    });
    const nameForText = (hex) => (hex.toUpperCase() === "#000000" ? "Black" : "White");
    const opacityNote = (opacity) => (opacity < 1 ? Math.round(opacity * 100) + "% opacity" : null);

    /* ------------------------------- helpers ------------------------------ */
    const hexToRgb = (hex) => {
      const h = hex.replace("#", "");
      return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) };
    };
    const toRgba = (hex, opacity) => {
      const { r, g, b } = hexToRgb(hex);
      return `rgba(${r}, ${g}, ${b}, ${opacity})`;
    };
    const getHueAngle = (hex) => {
      const { r, g, b } = hexToRgb(hex);
      const rn=r/255, gn=g/255, bn=b/255;
      const max=Math.max(rn,gn,bn), min=Math.min(rn,gn,bn), d=max-min;
      if (d===0) return 0;
      let h;
      if (max===rn) h=((gn-bn)/d)%6;
      else if (max===gn) h=(bn-rn)/d+2;
      else h=(rn-gn)/d+4;
      h=Math.round(h*60);
      return h<0 ? h+360 : h;
    };
    const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

    /* ------------------------------- icons -------------------------------- */
    const SlidersIcon = (p) => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
        <line x1="21" y1="4" x2="14" y2="4"/><line x1="10" y1="4" x2="3" y2="4"/>
        <line x1="21" y1="12" x2="12" y2="12"/><line x1="8" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="20" x2="16" y2="20"/><line x1="12" y1="20" x2="3" y2="20"/>
        <line x1="14" y1="2" x2="14" y2="6"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="16" y1="18" x2="16" y2="22"/>
      </svg>
    );
    const InfoIcon = (p) => (
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
    );

    /* -------------------------- SegmentedSlider --------------------------- */
    function SegmentedSlider({ segments, value, onChange, variant = "shade", ariaLabel }) {
      const wrapRef = useRef(null);
      const dragging = useRef(false);
      const n = segments.length;

      const indexFromClientX = useCallback((clientX) => {
        const el = wrapRef.current;
        if (!el) return value;
        const rect = el.getBoundingClientRect();
        const frac = (clientX - rect.left) / rect.width;
        return Math.min(n-1, Math.max(0, Math.floor(frac * n)));
      }, [n, value]);

      const start = (e) => { dragging.current = true; e.currentTarget.setPointerCapture?.(e.pointerId); onChange(indexFromClientX(e.clientX)); };
      const move  = (e) => { if (dragging.current) onChange(indexFromClientX(e.clientX)); };
      const end   = () => { dragging.current = false; };
      const onKey = (e) => {
        if (e.key==="ArrowLeft"||e.key==="ArrowDown"){ e.preventDefault(); onChange(Math.max(0,value-1)); }
        else if (e.key==="ArrowRight"||e.key==="ArrowUp"){ e.preventDefault(); onChange(Math.min(n-1,value+1)); }
      };

      const thumbLeft = `${((value + 0.5) / n) * 100}%`;
      const thumbFill = variant === "hue" ? segments[value] : "#FFFFFF";

      return (
        <div ref={wrapRef} role="slider" tabIndex={0} aria-label={ariaLabel}
             aria-valuemin={0} aria-valuemax={n-1} aria-valuenow={value}
             onPointerDown={start} onPointerMove={move} onPointerUp={end} onPointerCancel={end} onKeyDown={onKey}
             className="relative w-full cursor-pointer select-none outline-none touch-none focus-visible:ring-2 focus-visible:ring-neutral-400/60 rounded-md">
          <div className="flex h-3.5 w-full overflow-hidden rounded-md ring-1 ring-black/10">
            {segments.map((color, i) => (
              <div key={i} className="h-full flex-1 transition-colors duration-300" style={{ backgroundColor: color }} />
            ))}
          </div>
          <div className="pointer-events-none absolute top-1/2 h-[18px] w-[18px] -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-white transition-[left] duration-200 ease-out"
               style={{ left: thumbLeft, backgroundColor: thumbFill, boxShadow: "0 1px 4px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.06)" }} />
        </div>
      );
    }

    /* ------------------------------ ColorCard ----------------------------- */
    function ColorCard({ label, name, hex, note }) {
      const [copied, setCopied] = useState(false);
      const timer = useRef(null);
      const copy = useCallback(() => {
        const done = () => {
          setCopied(true);
          clearTimeout(timer.current);
          timer.current = setTimeout(() => setCopied(false), 1400);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(hex).then(done, done);
        } else {
          const ta = document.createElement("textarea");
          ta.value = hex; ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select();
          try { document.execCommand("copy"); } catch (e) {}
          document.body.removeChild(ta); done();
        }
      }, [hex]);
      return (
        <button
          type="button"
          onClick={copy}
          title={"Copy " + hex}
          className="w-full cursor-pointer rounded-2xl border border-neutral-200 bg-white p-3 text-left transition-colors hover:border-neutral-300 hover:bg-neutral-50 active:bg-neutral-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-neutral-300"
        >
          <p className="mb-2 flex items-center justify-between gap-2 text-[12px] leading-tight text-neutral-500">
            <span className="truncate">{label}{note && <span className="text-neutral-400"> · {note}</span>}</span>
            <span className="inline-flex shrink-0 items-center text-neutral-400" aria-hidden="true">
              {copied
                ? <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                : <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>}
            </span>
          </p>
          <div className="flex items-center gap-2.5">
            <div className="h-10 w-10 shrink-0 rounded-lg border border-black/5 transition-colors duration-300" style={{ backgroundColor: hex }} />
            <div className="min-w-0 flex-1">
              <p className="truncate text-[14px] font-semibold leading-tight text-neutral-900">{name}</p>
              <p className="mt-0.5 truncate text-[12px] uppercase tracking-wide text-neutral-500">{copied ? "Copied to clipboard" : hex}</p>
            </div>
          </div>
        </button>
      );
    }

    function SectionHeader({ title, subtitle, trailing }) {
      return (
        <div className="mb-2 flex items-start justify-between gap-3">
          <div>
            <p className="text-[14px] font-semibold leading-tight text-neutral-900">{title}</p>
            <p className="text-[12px] text-neutral-500">{subtitle}</p>
          </div>
          {trailing}
        </div>
      );
    }

    /* --------------------------- BrandColorTool --------------------------- */
    function BrandColorTool({ hueIndex, shadeIndex, onHue, onShade }) {
      const hueKeys = Object.keys(palette);
      const hueKey = hueKeys[hueIndex];
      const hueName = cap(hueKey);
      const hueSegments = hueKeys.map((k) => palette[k].hue);
      const shadeSegments = palette[hueKey].shades;
      const angle = getHueAngle(palette[hueKey].hue);
      const { background: currentHex, text } = resolveColors(hueKey, shadeIndex);

      return (
        <div className="w-full max-w-[440px] rounded-3xl bg-white p-4 shadow-[0_20px_60px_-15px_rgba(0,0,0,0.25)]">
          <SectionHeader title="Hue" subtitle="Pick a color family"
            trailing={<span className="mt-0.5 rounded bg-neutral-100 px-1.5 py-0.5 text-[11px] font-medium text-neutral-600">{angle}°</span>} />
          <SegmentedSlider segments={hueSegments} value={hueIndex} onChange={onHue} variant="hue" ariaLabel="Hue" />

          <div className="mt-2.5 flex items-center justify-between">
            <div className="flex items-center gap-2 text-[13px]">
              <span className="h-3 w-3 rounded-full transition-colors duration-300" style={{ backgroundColor: palette[hueKey].hue }} />
              <span className="font-semibold text-neutral-900">{hueName}</span>
              <span className="text-neutral-300">|</span>
              <span className="text-neutral-500">{angle}°</span>
            </div>
            <button type="button" aria-label="Adjust settings" className="rounded-md p-1 text-neutral-500 transition-colors hover:bg-neutral-100 hover:text-neutral-700">
              <SlidersIcon width="16" height="16" />
            </button>
          </div>

          <div className="mt-3">
            <SectionHeader title="Shade" subtitle={`Adjust the shade of ${hueName}`} />
            <SegmentedSlider segments={shadeSegments} value={shadeIndex} onChange={onShade} variant="shade" ariaLabel={`Shade of ${hueName}`} />
            <div className="mt-1.5 flex justify-between text-[11px] text-neutral-500"><span>Light</span><span>Dark</span></div>
          </div>

          <div className="mt-3 flex items-start gap-2 text-[11px] text-neutral-500">
            <InfoIcon width="13" height="13" className="mt-0.5 shrink-0 text-neutral-400" />
            <p>Drag the sliders to explore colors. Shade and tone can be adjusted separately.</p>
          </div>

          <div className="mt-3 grid grid-cols-1 gap-2.5 sm:grid-cols-2">
            <ColorCard label="Current color" name={hueName} hex={currentHex} />
            <ColorCard label="Text color" name={nameForText(text.color)} hex={text.color} note={opacityNote(text.opacity)} />
          </div>
        </div>
      );
    }

    function App() {
      const hueKeys = Object.keys(palette);
      const [hueIndex, setHueIndex] = useState(3);
      const [shadeIndex, setShadeIndex] = useState(3);
      const hueKey = hueKeys[hueIndex];
      const { background, text } = resolveColors(hueKey, shadeIndex);

      const handleHue = (i) => {
        setHueIndex(i);
        setShadeIndex((prev) => Math.min(prev, palette[hueKeys[i]].shades.length - 1));
      };

      return (
        <div className="flex min-h-[100svh] flex-col px-6 py-5 transition-colors duration-500 ease-out sm:px-10 sm:py-5" style={{ backgroundColor: background }}>
          <div className="mx-auto flex w-full max-w-[1400px] flex-1 flex-row items-stretch gap-12">
            <div className="flex flex-1 items-center">
              <h1 className="cit-headline transition-colors duration-500 ease-out" style={{ color: toRgba(text.color, text.opacity) }}>
                <span className="block">Home to</span>
                <span className="block">world&rsquo;s best</span>
                <span className="block">experiences</span>
              </h1>
            </div>
            <div className="w-[400px] shrink-0 self-center">
              <BrandColorTool hueIndex={hueIndex} shadeIndex={shadeIndex} onHue={handleHue} onShade={setShadeIndex} />
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
