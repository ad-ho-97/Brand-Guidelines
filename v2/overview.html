<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Overview · Headout brand guidelines</title>
  <meta name="description" content="Headout brand guidelines: logo, colour, typography, layout, motion and iconography." />
  <link rel="preload" href="../assets/shared/fonts/HalyardText-Book.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    @font-face { font-family:'Halyard Text'; font-weight:400; font-display:swap; src:url('../assets/shared/fonts/HalyardText-Book.woff2') format('woff2'); }
    @font-face { font-family:'Halyard Text'; font-weight:300; font-display:swap; src:url('../assets/shared/fonts/HalyardText-Light.woff2') format('woff2'); }
    :root { --bg:#fff; --ink:#111; --muted:#767676; --purple:#8000ff; --ht:'Halyard Text', system-ui, sans-serif; --ease-out:cubic-bezier(.23,1,.32,1); --pad:32px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--bg); color: var(--ink); font-family: var(--ht); -webkit-font-smoothing: antialiased; overflow: hidden; height: 100svh; }
    body.is-grid { overflow: auto; height: auto; }
    a { color: inherit; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ─── Frame (shared by both views): top bar + bottom bar, fixed ─── */
    .bar { position: fixed; left: 0; right: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: var(--pad); pointer-events: none; }
    .bar > * { pointer-events: auto; }
    .bar.top { top: 0; }
    .bar.bottom { bottom: 0; align-items: flex-end; }
    .site-logo { display: block; line-height: 0; }
    .site-logo img { height: 19px; width: auto; }

    /* Frosted pill toggle, centred on the viewport */
    .seg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; gap: 4px; padding: 4px; border-radius: 999px;
      background: rgb(128 0 255 / .08); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
    .seg button { height: 36px; padding: 0 20px; border-radius: 999px; background: transparent; color: var(--purple); font-size: 14px; letter-spacing: -.01em; }
    .seg button[aria-pressed="true"] { background: var(--purple); color: #fff; }

    button { font: inherit; border: 0; cursor: pointer; transition: background .2s ease, color .2s ease, transform .12s ease, opacity .2s ease; }
    button:active { transform: scale(.96); }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--purple); outline-offset: 3px; }

    /* Bottom: live caption (left) · progress (centre) · links (right) */
    /* Bottom centre: the front tile's name, with the progress ticks under it. */
    .now { position: absolute; left: 50%; bottom: calc(var(--pad) + 20px); transform: translateX(-50%); margin: 0; font-size: 14px; line-height: 1.2; white-space: nowrap; text-align: center;
      transition: opacity .18s ease, filter .18s ease; }
    .now.swap { opacity: 0; filter: blur(2px); }
    body.is-grid .now { opacity: 0; }
    .progress { position: absolute; left: 50%; bottom: calc(var(--pad) + 4px); transform: translateX(-50%); display: flex; gap: 6px; transition: opacity .2s ease; }
    .progress i { width: 22px; height: 3px; border-radius: 3px; background: var(--ink); opacity: .12; }
    body.is-grid .progress { opacity: 0; }
    .links { width: 260px; display: flex; justify-content: flex-end; gap: 16px; font-size: 12px; }
    .links a { text-decoration: none; color: var(--muted); transition: color .2s ease; }

    @media (hover: hover) and (pointer: fine) {
      .seg button[aria-pressed="false"]:hover { background: rgb(128 0 255 / .1); }
      .links a:hover { color: var(--ink); }
    }

    /* ─── Ring: GL canvas behind, invisible DOM cards on top for pointer/focus/AT ─── */
    .stage { position: fixed; inset: 0; perspective: 1400px; overflow: hidden; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; outline: none; }
    .stage.dragging { cursor: grabbing; }
    .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .track { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(-3deg) rotateZ(-4deg); }
    .card { position: absolute; left: 50%; top: 50%; width: min(calc(var(--card-vw, 52) * 1vw), calc(var(--card-svh, 78) * 1svh)); aspect-ratio: 4 / 3; backface-visibility: hidden; text-decoration: none; color: inherit; cursor: inherit; border-radius: 4px; }
    .track .card.is-front { cursor: pointer; }
    .stage.dragging .card { cursor: grabbing; }
    .stage:focus-visible .card.is-front { outline: 2px solid var(--purple); outline-offset: 3px; }
    .gl .track .media, .track .cap { visibility: hidden; }
    body.is-grid .stage { display: none; }

    .media { position: absolute; inset: 0; overflow: hidden; border-radius: 4px; background: #f2f2f2; }
    .media > * { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; opacity: 0; transition: opacity .4s ease, transform .5s var(--ease-out); }
    .media.loaded > *, .media.mask > * { opacity: 1; }
    .media.mask { background: #f0f0f0; }

    /* ─── Ring cursor: an arrow that follows the pointer (mouse/trackpad only) ─── */
    /* Just the arrow. White + difference blend so it inverts against whatever is under it
       (dark on the white page, light on a dark image). */
    .ring-cursor { --size: 96px; position: fixed; left: 0; top: 0; z-index: 30; width: var(--size); height: var(--size); margin: calc(var(--size) / -2) 0 0 calc(var(--size) / -2); pointer-events: none;
      display: none; mix-blend-mode: difference; }
    .ring-cursor .dot { width: 100%; height: 100%; display: grid; place-items: center; color: #fff;
      opacity: 0; transform: scale(.6); transition: opacity .18s ease, transform .22s var(--ease-out); }
    .ring-cursor.on .dot { opacity: 1; transform: scale(1); }
    .ring-cursor.down .dot { transform: scale(.88); }
    .ring-cursor svg { width: var(--size); height: var(--size); transition: transform .28s var(--ease-out); }
    .ring-cursor[data-dir="prev"] svg { transform: rotate(180deg); }
    .ring-cursor[data-dir="open"] svg { transform: rotate(-45deg); }
    @media (hover: hover) and (pointer: fine) {
      .ring-cursor { display: block; }
      .stage, .stage .card, .stage.dragging, .stage.dragging .card, .track .card.is-front { cursor: none; }
    }
    body.is-grid .ring-cursor { display: none; }

    /* ─── Grid ─── */
    .grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 104px var(--pad) 120px; }
    body.is-grid .grid { display: grid; }
    .grid .card { position: relative; left: auto; top: auto; width: auto; border-radius: 6px;
      transition: opacity .3s ease, transform .16s var(--ease-out); animation: ov-in .35s var(--ease-out) backwards; }
    .grid .card:active { transform: scale(.985); }
    .grid .card:focus-visible { outline: 2px solid var(--purple); outline-offset: 3px; }
    .grid .card:nth-child(2) { animation-delay: 30ms } .grid .card:nth-child(3) { animation-delay: 60ms }
    .grid .card:nth-child(4) { animation-delay: 90ms } .grid .card:nth-child(5) { animation-delay: 120ms } .grid .card:nth-child(6) { animation-delay: 150ms }
    .grid .media { border-radius: 6px; }
    /* Hairline keeps light tiles (Layout, Iconography) from dissolving into the white page. */
    .grid .media::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .06); pointer-events: none; }

    /* Caption lives inside the card: a soft scrim + text that rises in on hover. */
    .cap { position: absolute; inset: auto 0 0 0; z-index: 1; display: flex; flex-direction: column; gap: 4px; padding: 56px 20px 18px;
      border-radius: 0 0 6px 6px; color: #fff; pointer-events: none;
      background: linear-gradient(to top, rgb(0 0 0 / .55), rgb(0 0 0 / .28) 50%, rgb(0 0 0 / 0));
      opacity: 0; transition: opacity .15s ease; }
    .cap b { font-weight: 400; font-size: 16px; line-height: 1.2; display: inline-flex; gap: 6px; align-items: baseline; }
    .cap > span { font-weight: 300; font-size: 13px; line-height: 1.35; color: rgb(255 255 255 / .82); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cap b, .cap > span { transform: translateY(6px); opacity: 0; transition: transform .15s ease, opacity .15s ease; }
    .go { display: inline-block; transform: translateX(-3px); transition: transform .22s var(--ease-out); }
    @media (hover: hover) and (pointer: fine) {
      .grid:hover .card:not(:hover) { opacity: .6; }
      .grid .card:hover .cap { opacity: 1; transition-duration: .22s; }
      .grid .card:hover .cap b, .grid .card:hover .cap > span { transform: none; opacity: 1; transition: transform .26s var(--ease-out), opacity .22s ease; }
      .grid .card:hover .cap > span { transition-delay: 40ms; }
      .grid .card:hover .go { transform: none; }
      .grid .card:hover .media > * { transform: scale(1.03); }
    }
    /* Touch: no hover, so the caption is always there. Keyboard focus shows it too. */
    @media (hover: none) { .grid .cap, .grid .cap b, .grid .cap > span { opacity: 1; transform: none; } }
    .grid .card:focus-visible .cap, .grid .card:focus-visible .cap b, .grid .card:focus-visible .cap > span { opacity: 1; transform: none; }
    @keyframes ov-in { from { opacity: 0; transform: translateY(8px) scale(.98); } }

    @media (max-width: 767px) {
      :root { --pad: 16px; }
      .card { width: 84vw; }
      .track { transform: rotateX(-2deg) rotateZ(-2deg); }
      .grid { grid-template-columns: 1fr; padding-top: 80px; }
      .links { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .grid .card { animation: ov-fade .2s ease backwards; }
      @keyframes ov-fade { from { opacity: 0; } }
    }
  </style>
</head>
<body>
<h1 class="sr">Headout brand guidelines</h1>

<header class="bar top">
  <a class="site-logo" href="/v2/overview.html" aria-label="Headout guidelines — Overview"><img src="../assets/shared/brand/logo-full.svg" alt="" /></a>
  <div class="seg" role="group" aria-label="View">
    <button type="button" aria-pressed="true" data-view="ring">Ring</button>
    <button type="button" aria-pressed="false" data-view="grid">Grid</button>
  </div>
</header>

<div class="ring-cursor" id="ring-cursor" aria-hidden="true"><div class="dot"><svg viewBox="0 0 18 18" fill="none"><path d="M3 9h12m0 0-5-5m5 5-5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
<main>
  <div class="stage" id="stage" tabindex="0" aria-roledescription="carousel" aria-label="Brand guidelines sections">
    <span class="sr" id="ring-status" aria-live="polite"></span>
    <canvas id="gl" aria-hidden="true"></canvas>
    <div class="track" id="track"></div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer class="bar bottom">
  <span></span>
  <p class="now" id="now-title" aria-hidden="true"></p>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <nav class="links" aria-label="Elsewhere"><a href="https://www.headout.com" target="_blank" rel="noopener">headout.com</a></nav>
</footer>

<script>
(function () {
  const MASK = '<svg viewBox="0 0 505 630" preserveAspectRatio="xMidYMid meet" fill="none"><path d="M254.071 386.708C278.592 386.708 299.188 370.158 304.972 347.783C307.663 337.372 303.756 334.982 293.462 334.982H214.68C204.386 334.982 200.48 337.372 203.171 347.783C208.955 370.158 229.551 386.708 254.071 386.708Z" stroke="#000" stroke-width="20.418" stroke-linecap="round" stroke-linejoin="round"/><path d="M189.385 276.775C189.385 266.062 198.069 257.378 208.782 257.378C219.495 257.378 228.179 266.062 228.179 276.775M279.904 276.775C279.904 266.062 288.589 257.378 299.301 257.378C310.014 257.378 318.699 266.062 318.699 276.775" stroke="#000" stroke-width="20.418" stroke-linecap="round" stroke-linejoin="round"/><path d="M351.039 189.652C369.375 187.286 385.223 202.434 383.688 220.858L373.541 342.608C368.291 405.604 315.63 454.06 252.416 454.061C189.202 454.061 136.54 405.605 131.29 342.608L120.911 218.065C119.505 201.193 134.099 187.365 150.871 189.679C215.02 198.527 280.06 198.811 344.284 190.524L351.039 189.652Z" stroke="#000" stroke-width="20.418"/></svg>';
  const SECTIONS = [
    { name: 'Logo',        desc: 'The blimp and wordmark, and how to use them.',          href: '/v2/logo-fluid.html',   img: '../assets/logo/logo-action-2.jpg' },
    { name: 'Colour',      desc: 'Purps, the supporting palette and how they combine.',    href: '/v2/color.html',        video: '../assets/overview/color-tile-loop.mp4' },
    { name: 'Typography',  desc: 'Halyard Display and Text, set with care.',               href: '/v2/typography.html',   video: '../assets/overview/type-tile-loop.mp4' },
    { name: 'Layout',      desc: 'Grids and templates that keep every surface consistent.', href: '/v2/layout.html',      img: '../assets/overview/layout-tile.jpg' },
    { name: 'Motion',      desc: 'How the brand moves — from the logo to the interface.',  href: '/motion',               video: '../assets/logo/logo-animation.mp4' },
    { name: 'Iconography', desc: 'Icons, tiles and avatars in the Headout style.',         href: '/v2/iconography.html',  svg: MASK },
  ];
  const BG = [1, 1, 1];          // matches --bg
  // Background photo, drawn inside the GL frame so the edge lens bends it too.
  // horizon = where the horizon sits in the image (0 top → 1 bottom); place = where it lands on screen.
  // Off for now — set enabled: true to bring the photo back.
  const BG_IMAGE = { enabled: false, src: '../assets/overview/overview-bg.jpg', horizon: 0.657, place: 0.6 };

  const stage = document.getElementById('stage'), track = document.getElementById('track'), grid = document.getElementById('grid');
  const status = document.getElementById('ring-status'), nowTitle = document.getElementById('now-title'), progress = document.getElementById('progress');

  function makeCard(s, withMedia) {
    const a = document.createElement('a');
    a.className = 'card'; a.href = s.href; a.draggable = false; a.setAttribute('aria-label', s.name);
    if (withMedia) {
      const m = s.img ? `<img src="${s.img}" alt="" draggable="false">`
              : s.video ? `<video src="${s.video}#t=0.1" autoplay loop muted playsinline preload="metadata"></video>` : s.svg;
      a.innerHTML = `<div class="media${s.svg ? ' mask' : ''}">${m}</div><div class="cap"><b>${s.name}<span class="go" aria-hidden="true">→</span></b><span>${s.desc}</span></div>`;
      const media = a.firstElementChild, el = media.firstElementChild;
      const done = () => media.classList.add('loaded');
      if (el.tagName === 'IMG') el.complete ? done() : el.addEventListener('load', done, { once: true });
      else if (el.tagName === 'VIDEO') el.readyState >= 2 ? done() : el.addEventListener('loadeddata', done, { once: true });
    }
    return a;
  }
  SECTIONS.forEach(s => grid.appendChild(makeCard(s, true)));

  // Ring: the sections twice, so the wrap point sits behind the viewer and is never seen.
  // These DOM cards are invisible hit targets; the visuals are drawn in WebGL underneath.
  const RING = SECTIONS.concat(SECTIONS);
  const cards = RING.map(s => { const c = track.appendChild(makeCard(s, false)); c.tabIndex = -1; c.setAttribute('aria-hidden', 'true'); return c; });
  SECTIONS.forEach(() => progress.appendChild(document.createElement('i')));
  const ticks = [...progress.children];

  const N = cards.length, M = SECTIONS.length;
  // `let` so the DialKit panel (dev only) can retune them live.
  let STEP = 34, VISIBLE = 2.35, FADE = 0.75;
  let THROW_TAU = 0.3, MAX_THROW = 3, STOP_SPEED = 0.6, MIN_LANDING = 0.22;
  const VEL_WINDOW = 80, NOTCH_PX = 60; let WHEEL_RESPONSE = 0.14;
  let PERSPECTIVE = 1400, STEP_DURATION = 0.35, CURSOR_LAG = 0.05, HOVER_ZOOM = 0.03;
  let TILT = { x: -3, z: -4 }, TILT_MOBILE = { x: -2, z: -2 };
  // Liquid-glass edges (ported from the disc reel's edge lens).
  const LENS = { band: 0.32, stretch: 0.14, swell: 0.23, dispersionPx: 3.5, blurPx: 13 };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let ringVisible = true, hover = 0, hoverTarget = false;

  // ─── Layout ───
  let w = 0, h = 0, R = 0, pxPerCard = 1, tilt = { x: -3, z: -4 };
  function measure() {
    w = cards[0].offsetWidth; h = cards[0].offsetHeight;
    R = (w * 1.05) / (2 * Math.sin(STEP * Math.PI / 360));
    pxPerCard = w * 1.05;
    tilt = innerWidth < 768 ? TILT_MOBILE : TILT;
    track.style.transform = `rotateX(${tilt.x}deg) rotateZ(${tilt.z}deg)`;
    stage.style.perspective = PERSPECTIVE + 'px';
    gl && resizeGL();
  }
  const wrap = o => ((o % N) + N + N / 2) % N - N / 2;
  const smooth = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
  const cardMatrix = o => `translateZ(${(R - w * 0.15).toFixed(2)}px) rotateY(${(o * STEP).toFixed(3)}deg) translateZ(${(-R).toFixed(2)}px)`;

  let pos = 0, rendered = NaN, front = -1;
  function render() {
    if (pos === rendered) return;
    rendered = pos;
    const near = Math.round(pos);
    cards.forEach((c, i) => {
      const o = wrap(i - pos), d = Math.abs(o);
      const op = smooth((VISIBLE - d) / FADE);
      c._o = o; c._op = op;
      if (op <= 0) { if (c._shown !== false) { c.style.visibility = 'hidden'; c._shown = false; } return; }
      if (c._shown !== true) { c.style.visibility = ''; c._shown = true; }
      c.style.transform = `translate3d(-50%,-50%,0) ${cardMatrix(o)}`;
      c.style.pointerEvents = d < 1.5 ? '' : 'none';
      if (!gl) c.style.opacity = op.toFixed(3);
    });
    // Progress: each tick lights by its distance from the current position, continuously.
    ticks.forEach((t, i) => {
      const d = Math.abs(((i - pos) % M + M + M / 2) % M - M / 2);
      t.style.opacity = (0.12 + 0.88 * Math.max(0, 1 - d)).toFixed(3);
    });
    const f = ((near % N) + N) % N;
    if (f !== front) {
      if (cards[front]) { cards[front].classList.remove('is-front'); cards[front].setAttribute('aria-hidden', 'true'); }
      front = f; cards[front].classList.add('is-front'); cards[front].removeAttribute('aria-hidden');
      const s = RING[front];
      status.textContent = `${s.name}, ${(front % M) + 1} of ${M}. Press Enter to open.`;
      setCaption(s);
    }
  }
  let capTimer = 0;
  function setCaption(s) {
    clearTimeout(capTimer);
    if (!nowTitle.textContent) { nowTitle.textContent = s.name; return; }
    nowTitle.classList.add('swap');
    capTimer = setTimeout(() => { nowTitle.textContent = s.name; nowTitle.classList.remove('swap'); }, 140);
  }

  // ─── WebGL: cards as perspective-correct quads, then the edge lens over the frame ───
  const canvas = document.getElementById('gl');
  let gl = null;
  try { gl = canvas.getContext('webgl', { antialias: true, alpha: false, premultipliedAlpha: false }); } catch (e) {}
  let bgTex = null, cardProg, lensProg, quadBuf, cardBuf, fbo, fboTex, texs = [], W = 0, H = 0, dpr = 1;

  function shader(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
  function program(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, shader(gl.VERTEX_SHADER, vs)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw gl.getProgramInfoLog(p);
    p.u = n => p[n] || (p[n] = gl.getUniformLocation(p, n));
    return p;
  }
  function initGL() {
    cardProg = program(`
      attribute vec4 aPos; attribute vec2 aUV; varying vec2 vUV;
      void main() { vUV = aUV; gl_Position = aPos; }`, `
      precision mediump float;
      varying vec2 vUV;
      uniform sampler2D uTex; uniform vec2 uCover; uniform vec2 uShift; uniform float uZoom; uniform float uAlpha;
      uniform vec2 uSize; uniform float uRadius; uniform float uReady;
      void main() {
        // object-fit: cover, plus a slight zoom on hover.
        vec2 uv = (vUV - 0.5) * uCover / uZoom + 0.5 + uShift;
        vec3 c = mix(vec3(0.949), texture2D(uTex, uv).rgb, uReady);
        // Rounded corners (px), anti-aliased.
        vec2 q = abs(vUV - 0.5) * uSize - (uSize * 0.5 - uRadius);
        float d = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - uRadius;   // signed: negative inside
        float a = (1.0 - smoothstep(-0.75, 0.75, d)) * uAlpha;
        if (a <= 0.0) discard;
        gl_FragColor = vec4(c * a, a);   // premultiplied
      }`);
    lensProg = program(`
      attribute vec2 aPos; void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`, `
      precision highp float;
      uniform sampler2D uFrame; uniform vec2 uResolution; uniform float uPixelRatio;
      uniform float uBand, uStretch, uSwell, uDispersion, uBlur, uSlope;
      const int TAPS = 10;
      void main() {
        vec2 p = gl_FragCoord.xy; float W = uResolution.x, H = uResolution.y;
        float bandPx = max(uBand * W, 1.0);
        float fromLeft = (bandPx - p.x) / bandPx, fromRight = (p.x - (W - bandPx)) / bandPx;
        float e = max(fromLeft, fromRight);
        if (e <= 0.0) { gl_FragColor = texture2D(uFrame, p / uResolution); return; }
        float t = smoothstep(0.0, 1.0, e), t2 = t * t;
        float inward = fromLeft > fromRight ? 1.0 : -1.0;
        float pull = uStretch * bandPx * t2;
        float lineY = H * 0.5 + (p.x - W * 0.5) * uSlope;
        float sy = lineY + (p.y - lineY) / (1.0 + uSwell * t2);
        float blur = uBlur * uPixelRatio * t2, split = uDispersion * uPixelRatio * t2;
        float jitter = fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))) - 0.5;
        vec3 acc = vec3(0.0); float accA = 0.0;
        for (int i = 0; i < TAPS; i++) {
          float k = (float(i) + 0.5 + jitter) / float(TAPS) - 0.5;
          float x = p.x + inward * pull + k * blur;
          acc.r += texture2D(uFrame, vec2(x + inward * split, sy) / uResolution).r;
          vec4 g = texture2D(uFrame, vec2(x, sy) / uResolution);
          acc.g += g.g; accA += g.a;
          acc.b += texture2D(uFrame, vec2(x - inward * split, sy) / uResolution).b;
        }
        gl_FragColor = vec4(acc, accA) / float(TAPS);   // premultiplied card layer
      }`);

        lens: { band: [0.32, 0, 0.5, 0.01], stretch: [0.14, 0, 0.6, 0.01], swell: [0.23, 0, 1, 0.01], dispersionPx: [3.5, 0, 20, 0.5], blurPx: [13, 0, 60, 1] },
        cursor: { size: [96, 16, 160, 1], lag: [0.05, 0, 0.3, 0.01], hoverZoom: [0.03, 0, 0.1, 0.005] },
        reset: { type: 'action' },
      }, { id: 'overview-ring-2', persist: true, onAction: path => { if (path === 'reset') kit.resetValues(); } });
      kit.subscribe(v => {
        document.documentElement.style.setProperty('--card-vw', v.layout.cardWidthVw);
        document.documentElement.style.setProperty('--card-svh', v.layout.cardMaxSvh);
        STEP = v.layout.step; PERSPECTIVE = v.layout.perspective;
        TILT = { x: v.layout.tiltX, z: v.layout.tiltZ };
        VISIBLE = v.layout.visible; FADE = v.layout.fade;
        STEP_DURATION = v.motion.stepDuration; THROW_TAU = v.motion.throwTau; MAX_THROW = v.motion.maxThrow;
        STOP_SPEED = v.motion.stopSpeed; MIN_LANDING = v.motion.minLanding; WHEEL_RESPONSE = v.motion.wheelResponse;
        Object.assign(LENS, v.lens);
        cursorEl.style.setProperty('--size', v.cursor.size + 'px');
        CURSOR_LAG = v.cursor.lag; HOVER_ZOOM = v.cursor.hoverZoom;
        measure(); rendered = NaN; render(); wake();
      });
    };
    document.head.appendChild(js);
  }

  addEventListener('resize', () => { measure(); rendered = NaN; render(); });
  measure();
  setView(store.get('view') === 'grid' ? 'grid' : 'ring');
  render(); wake();
})();
</script>
